<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ejercicio 25 - Color de Fondo</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: #264653;
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.6s ease;
      padding: 2rem;
    }

    .container { text-align: center; }

    h1 {
      font-family: 'Syne', sans-serif;
      font-size: 2.8rem;
      font-weight: 800;
      margin-bottom: 0.5rem;
      text-shadow: 0 2px 20px rgba(0,0,0,0.3);
    }

    p.descripcion {
      font-size: 1rem;
      opacity: 0.8;
      margin-bottom: 1rem;
    }

    #color-actual {
      font-family: monospace;
      font-size: 1rem;
      background: rgba(0,0,0,0.2);
      display: inline-block;
      padding: 0.3rem 1rem;
      border-radius: 50px;
      margin-bottom: 2.5rem;
      letter-spacing: 0.1em;
    }

    #btn-color {
      background: rgba(255,255,255,0.15);
      color: white;
      border: 2.5px solid rgba(255,255,255,0.5);
      padding: 1rem 3rem;
      border-radius: 50px;
      font-family: 'Syne', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.06em;
      backdrop-filter: blur(10px);
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
    }

    #btn-color:hover {
      background: rgba(255,255,255,0.25);
      transform: scale(1.05);
      box-shadow: 0 8px 30px rgba(0,0,0,0.2);
    }

    #btn-color:active { transform: scale(0.98); }

    #historial {
      margin-top: 2.5rem;
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      flex-wrap: wrap;
      max-width: 340px;
      margin-left: auto;
      margin-right: auto;
    }

    .chip {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.3);
      transition: transform 0.2s;
    }

    .chip:hover { transform: scale(1.3); }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎨 Color Shuffle</h1>
    <p class="descripcion">Hacé clic para cambiar el color de fondo aleatoriamente</p>
    <span id="color-actual">#264653</span>
    <br><br>
    <button id="btn-color">Cambiar Color</button>
    <div id="historial"></div>
  </div>

  <script src="js/ejercicio25.js"></script>
</body>
</html>
