<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Ejercicio 17</title>
</head>

<body>

    <script>
        const contarLetraA = (texto) => {
            let contador = 0;

            for (let i = 0; i < texto.length; i++) {
                if (texto[i].toLowerCase() === "a") {
                    contador++;
                }
            }

            return contador;
        };

        const texto = prompt("Ingrese un texto:");

        document.write(`
    <h2>La letra "a" aparece ${contarLetraA(texto)} veces</h2>`);
    </script>

</body>

</html>
