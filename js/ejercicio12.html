<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Ejercicio 12</title>
</head>

<body>

    <script>
        const numero = parseInt(prompt("Ingrese un número:"));

        if (numero % 2 === 0) {
            document.write(`<h2>El número ${numero} es PAR</h2>`);
        } else {
            document.write(`<h2>El número ${numero} es IMPAR</h2>`);
        }
    </script>

</body>

</html>
