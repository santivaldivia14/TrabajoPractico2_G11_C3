<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ejercicio 21 - Países y Capitales</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; background: #eaf0fb; margin: 0; }
    .card { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); min-width: 320px; }
    h2 { margin-top: 0; color: #2c3e50; }
    label { display: block; margin-bottom: 0.3rem; color: #555; }
    select { width: 100%; padding: 0.6rem; border: 1px solid #ddd; border-radius: 6px; margin-bottom: 1.2rem; font-size: 1rem; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Países y Capitales de América</h2>
    <label for="pais">País</label>
    <select id="pais"></select>
    <label for="capital">Capital</label>
    <select id="capital"></select>
  </div>
  <script type="module" src="js/ejercicio21.js"></script>
</body>
</html>
