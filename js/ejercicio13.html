<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Ejercicio 13</title>
</head>

<body>

    <script>
        const mostrarArreglo = (arreglo) => {
            arreglo.forEach((numero) => {
                document.write(`<h3>${numero}</h3>`);
            });
        };

        const cantidad = parseInt(prompt("¿Cuántos números desea ingresar?"));

        const numeros = [];

        for (let i = 0; i < cantidad; i++) {
            numeros.push(parseInt(prompt(`Ingrese el número ${i + 1}:`)));
        }

        mostrarArreglo(numeros);
    </script>

</body>

</html>
