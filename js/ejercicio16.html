<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Ejercicio 16</title>
</head>

<body>

    <script>
        const sumarRango = (inicio, fin) => {
            let suma = 0;

            for (let i = inicio; i <= fin; i++) {
                suma += i;
            }

            return suma;
        };

        const inicio = parseInt(prompt("Ingrese el número inicial:"));
        const fin = parseInt(prompt("Ingrese el número final:"));

        if (inicio <= fin) {
            document.write(`
        <h2>La suma del rango es: ${sumarRango(inicio, fin)}</h2>`);
        } else {
            document.write(`
        <h2>El número inicial debe ser menor o igual al final</h2>`);
        }
    </script>

</body>

</html>
