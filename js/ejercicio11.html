<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Ejercicio 11</title>
</head>

<body>

    <script>
        const kilometros = parseFloat(prompt("Ingrese los kilómetros recorridos:"));
        const litros = parseFloat(prompt("Ingrese los litros consumidos:"));

        const consumo = litros / kilometros;

        document.write(`
    <h2>Kilómetros recorridos: ${kilometros}</h2>
    <h2>Litros consumidos: ${litros}</h2>
    <h2>Consumo por kilómetro: ${consumo}</h2>
`);
    </script>

</body>

</html>
