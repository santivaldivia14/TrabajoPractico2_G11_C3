<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ejercicio 20 - Formulario</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; background: #f0f4f8; margin: 0; }
    .card { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); min-width: 320px; }
    h2 { margin-top: 0; color: #2c3e50; }
    label { display: block; margin-bottom: 0.3rem; color: #555; font-size: 0.9rem; }
    input { width: 100%; padding: 0.6rem; border: 1px solid #ddd; border-radius: 6px; margin-bottom: 1rem; box-sizing: border-box; font-size: 1rem; }
    button { width: 100%; padding: 0.8rem; background: #2ecc71; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 1rem; transition: background 0.3s; }
    button:hover { background: #27ae60; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Datos del Estudiante</h2>
    <label for="nombre">Nombre</label>
    <input type="text" id="nombre" placeholder="Ingrese su nombre">
    <label for="apellido">Apellido</label>
    <input type="text" id="apellido" placeholder="Ingrese su apellido">
    <label for="libreta">Libreta Universitaria</label>
    <input type="text" id="libreta" placeholder="APU999999">
    <button id="btnMostrar">Mostrar Datos</button>
  </div>
  <script type="module" src="js/ejercicio20.js"></script>
</body>
</html>
